name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR 来自 fork 时，CI 只拿只读 token；即使代码被合并也改不了仓库。
permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 两个脚本只允许用标准库。引入 urllib / subprocess / socket / requests
      # 之类的 PR 会在这里失败，防止被改成会联网或执行命令的脚本。
      - name: Audit script imports
        run: |
          python - <<'PY'
          import ast
          import sys

          allowed = {"argparse", "datetime", "html", "json", "os", "re", "sys", "pathlib"}
          for name in ("render.py", "audit.py"):
              found = set()
              tree = ast.parse(open(name, encoding="utf-8").read())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          found.add(alias.name.split(".")[0])
                  elif isinstance(node, ast.ImportFrom) and node.module and node.level == 0:
                      found.add(node.module.split(".")[0])
              print(name, "imports:", sorted(found))
              # audit.py imports the sibling render module; everything else must be stdlib.
              local = {"render"} if name == "audit.py" else set()
              bad = sorted(found - allowed - local)
              if bad:
                  sys.exit(name + ": unexpected imports (scripts must stay stdlib-only): " + ", ".join(bad))
          PY

      - name: Compile scripts
        run: python -m py_compile render.py audit.py

      - name: Check sample tree
        run: python render.py .github/test-tree.md --check

      - name: Audit sample tree
        run: python audit.py .github/test-tree.md --strict

      - name: Render sample tree
        run: python render.py .github/test-tree.md -o /tmp/product-tree.html

      - name: Verify output
        run: |
          test -s /tmp/product-tree.html
          grep -q "<svg" /tmp/product-tree.html
          ! grep -q "__TREE_DATA__" /tmp/product-tree.html
          ! grep -q "__TITLE__" /tmp/product-tree.html
          wc -c /tmp/product-tree.html
