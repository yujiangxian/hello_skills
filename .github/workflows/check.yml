name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR 来自 fork 时，CI 只拿只读 token；即使代码被合并也改不了仓库。
permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 这个渲染器只允许用标准库。引入 urllib / subprocess / socket / requests
      # 之类的 PR 会在这里失败，防止被改成会联网或执行命令的脚本。
      - name: Audit renderer imports
        run: |
          python - <<'PY'
          import ast
          import sys

          allowed = {"argparse", "datetime", "html", "json", "os", "re", "sys", "pathlib"}
          src = open("render.py", encoding="utf-8").read()
          tree = ast.parse(src)
          found = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      found.add(alias.name.split(".")[0])
              elif isinstance(node, ast.ImportFrom) and node.module and node.level == 0:
                  found.add(node.module.split(".")[0])
          print("imports:", sorted(found))
          bad = sorted(found - allowed)
          if bad:
              sys.exit("unexpected imports (renderer must stay stdlib-only): " + ", ".join(bad))
          PY

      - name: Compile renderer
        run: python -m py_compile render.py

      - name: Check sample tree
        run: python render.py .github/test-tree.md --check

      - name: Render sample tree
        run: python render.py .github/test-tree.md -o /tmp/product-tree.html

      - name: Verify output
        run: |
          test -s /tmp/product-tree.html
          grep -q "<svg" /tmp/product-tree.html
          ! grep -q "__TREE_DATA__" /tmp/product-tree.html
          ! grep -q "__TITLE__" /tmp/product-tree.html
          wc -c /tmp/product-tree.html
